version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run --workspace=@pingboard/shared build
    build:
      commands:
        - npm run --workspace=@pingboard/web build
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.npm/**/*
