name: PingBoard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck & Build Shared Packages
        run: npm run --workspace=packages/shared build

      - name: Run Express API Tests
        run: npm run --workspace=apps/api test

      - name: Run Lambda Health-Checker Tests
        run: npm run --workspace=apps/lambda-checker test

      - name: Build All Workspaces (API, Lambdas, Web App)
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy-aws:
    name: CDK Deploy to AWS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build All Workspace Packages
        run: npm run build

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Validate AWS Credentials Configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ] && { [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; }; then
            echo "Configure AWS_ROLE_TO_ASSUME for GitHub OIDC, or configure both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY repository secrets."
            exit 1
          fi

      - name: Configure AWS Credentials with OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS Credentials with Access Keys
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set AWS Account ID for CDK
        shell: bash
        env:
          AWS_ACCOUNT_ID_SECRET: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "$AWS_ACCOUNT_ID_SECRET" ]; then
            echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"
          else
            echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"
          fi

      - name: CDK Synthesize
        run: npx cdk synth --app "node infra/dist/bin/app.js"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: CDK Deploy All Stacks
        run: npx cdk deploy --all --require-approval never --app "node infra/dist/bin/app.js"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
