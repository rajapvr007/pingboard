name: PingBoard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck & Build Shared Packages
        run: npm run --workspace=packages/shared build

      - name: Run Express API Tests
        run: npm run --workspace=apps/api test

      - name: Run Lambda Health-Checker Tests
        run: npm run --workspace=apps/lambda-checker test

      - name: Build All Workspaces (API, Lambdas, Web App)
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy-aws:
    name: CDK Deploy to AWS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build All Workspace Packages
        run: npm run build

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Configure AWS Credentials (OIDC or Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: CDK Synthesize
        run: npx cdk synth --app "node infra/dist/bin/app.js"
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: CDK Deploy All Stacks
        run: npx cdk deploy --all --require-approval never --app "node infra/dist/bin/app.js"
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
